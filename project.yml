name: PastebotBridge
options:
  bundleIdPrefix: dev.pastebotbridge
  deploymentTarget:
    iOS: "26.0"
    macOS: "14.0"
  createIntermediateGroups: true
# DEVELOPMENT_TEAM comes from Config/Local.xcconfig (see Config/Local.xcconfig.example).
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "1"
targets:
  # Menu bar app that reads Pastebot's database and uploads it to CloudKit.
  PastebotBridge:
    type: application
    platform: macOS
    sources: [Mac, Shared]
    entitlements:
      path: Mac/PastebotBridge.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.dev.pastebotbridge]
        com.apple.developer.icloud-services: [CloudKit]
        # Same data as TestFlight builds, even when run from Xcode.
        com.apple.developer.icloud-container-environment: Production
    settings:
      base:
        PRODUCT_NAME: Pastebot Bridge
        PRODUCT_BUNDLE_IDENTIFIER: dev.pastebotbridge.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pastebot Bridge
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # Must NOT be sandboxed: it reads another app's container (needs Full Disk Access).
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES   # required for notarization
        CODE_SIGN_STYLE: Automatic

  # iPhone/iPad viewer.
  PasteViewer:
    type: application
    platform: iOS
    sources: [iOS, Shared]
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Pastebot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # CloudKit silent pushes wake the app to sync in the background.
        UIBackgroundModes:
          - remote-notification
        # Only Apple's encryption (HTTPS/CloudKit): skips the export-compliance question on upload.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: iOS/PasteViewer.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.dev.pastebotbridge]
        com.apple.developer.icloud-services: [CloudKit]
        # Same data as TestFlight builds, even when run from Xcode.
        com.apple.developer.icloud-container-environment: Production
        aps-environment: development
    settings:
      base:
        PRODUCT_NAME: PasteViewer
        PRODUCT_BUNDLE_IDENTIFIER: dev.pastebotbridge.viewer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic

# Shared schemes so command-line builds don't depend on Xcode's per-user autogenerated ones.
schemes:
  PastebotBridge:
    build:
      targets:
        PastebotBridge: all
    run:
      config: Debug
    archive:
      config: Release
  PasteViewer:
    build:
      targets:
        PasteViewer: all
    run:
      config: Debug
    archive:
      config: Release
